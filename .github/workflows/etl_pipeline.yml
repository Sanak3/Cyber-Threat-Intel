name: Sincronizacao Diaria NIST -> AWS RDS (10k CVEs)

on:
  schedule:
    # Executa todos os dias às 03:00 BRT (06:00 UTC)
    - cron: '0 6 * * *'
  # Permite disparar manualmente pela aba Actions do GitHub
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r data_pipeline/requirements.txt

      - name: Executar Pipeline ETL (10.000 Registros)
        env:
          NIST_API_KEY: ${{ secrets.NIST_API_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          python data_pipeline/upload_aws.py